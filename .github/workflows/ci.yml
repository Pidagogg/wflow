name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The test suite includes tests/all-nodes.test.js which exercises every
      # node type through the real executor — 180 assertions plus the existing
      # node --test suites.
      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build